services:
  # ==========================================
  # Tier 3: PostgreSQL Database
  # ==========================================
  database:
    image: postgres:16-alpine
    container_name: ramguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ramguard_db}
      POSTGRES_USER: ${POSTGRES_USER:-ramguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ramguard_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ramguard_user} -d ${POSTGRES_DB:-ramguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ramguard-net

  # ==========================================
  # Tier 2: Node.js / Express Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ramguard-backend
    restart: unless-stopped
    environment:
      PORT: ${BACKEND_PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-ramguard_db}
      DB_USER: ${POSTGRES_USER:-ramguard_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ramguard_secure_pass_2026}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ramguard-net

  # ==========================================
  # Tier 1: Presentation Tier (React + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ramguard-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ramguard-net

volumes:
  pgdata:
    driver: local

networks:
  ramguard-net:
    driver: bridge
